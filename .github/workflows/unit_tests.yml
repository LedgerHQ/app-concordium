name: Unit testing with Codecov coverage checking

# The triggers below were commented out, so this workflow gated nothing, and it changed into a
# unit-tests/ directory that did not exist on this branch - a manual run failed before CMake.
# Regression cover for the parsing and display helpers was therefore absent from CI entirely
# (finding V-116).
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  job_unit_test:
    name: Unit test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder-lite:latest

    steps:
      - name: Clone
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # deps/tinycbor is a submodule and cbor_data_blob.c parses through it, so a checkout
          # without it fails CMake outright. actions/checkout defaults to submodules: false.
          submodules: true

      - name: Clone SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: ledgerHQ/ledger-secure-sdk
          path: sdk

      - name: Build unit tests
        run: |
          cd unit-tests/
          export BOLOS_SDK=../sdk
          cmake -Bbuild -H. && make -C build && make -C build test

      - name: Generate code coverage
        run: |
          cd unit-tests/
          lcov --directory . -b "$(realpath build/)" --capture --initial -o coverage.base && \
          lcov --rc lcov_branch_coverage=1 --directory . -b "$(realpath build/)" --capture -o coverage.capture && \
          lcov --directory . -b "$(realpath build/)" --add-tracefile coverage.base --add-tracefile coverage.capture -o coverage.info && \
          lcov --directory . -b "$(realpath build/)" --remove coverage.info '*/unit-tests/*' -o coverage.info && \
          genhtml coverage.info -o coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: code-coverage
          path: unit-tests/coverage

      # The "Install codecov dependencies" step that used to sit here ran `apk add curl gpg`.
      # This job runs in ledger-app-builder-lite, which is Debian, so apk does not exist and the
      # step failed the job before the upload was even attempted. curl and gpg are already in
      # the image, so nothing needs installing.

      - name: Upload to codecov.io
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5
        # Coverage reporting is informational; the gate is the test result above. An upload
        # outage - or a missing CODECOV_TOKEN - must not turn a green test run red.
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./unit-tests/coverage.info
          flags: unittests
          name: codecov-app-concordium
          fail_ci_if_error: false
          verbose: true
